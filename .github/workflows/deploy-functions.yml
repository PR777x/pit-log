name: Deploy email alerts

# Deploys the Cloud Functions in /functions whenever they change on main.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT  the JSON key of a Google Cloud service account for the pit-log project
#   RESEND_API_KEY            the API key from resend.com
on:
  push:
    branches: [main]
    paths: ["functions/**", "firebase.json", "firestore.rules", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are set up
        id: gate
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RK: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$SA" ] || [ -z "$RK" ]; then echo "::notice::Skipping deploy: add the FIREBASE_SERVICE_ACCOUNT and RESEND_API_KEY repository secrets first."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Install function dependencies
        if: steps.gate.outputs.ok == 'true'
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Offline tests
        if: steps.gate.outputs.ok == 'true'
        working-directory: functions
        run: node test.js
      - name: Prepare deploy credentials
        if: steps.gate.outputs.ok == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        # Pasting the key on a phone can add stray line breaks. Real newlines inside the key are
        # stored as the two characters \n, so stripping actual line breaks is always safe.
        # Also accepts the key base64-encoded.
        run: |
          node -e '
            const fs = require("fs");
            let raw = process.env.SA.replace(/[\r\n\t]/g, "").trim();
            if (!raw.startsWith("{")) raw = Buffer.from(raw, "base64").toString("utf8");
            const key = JSON.parse(raw);
            if (key.type !== "service_account" || !key.private_key || !key.client_email) { console.error("That secret is not a service account key."); process.exit(1); }
            fs.writeFileSync(process.argv[1], JSON.stringify(key), { mode: 0o600 });
            console.log("Key OK for", key.client_email);
          ' "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Save the Resend key in Secret Manager
        if: steps.gate.outputs.ok == 'true'
        env:
          RESEND: ${{ secrets.RESEND_API_KEY }}
        run: |
          printf '%s' "$RESEND" > "$RUNNER_TEMP/resend.txt"
          npx -y firebase-tools@latest functions:secrets:set RESEND_API_KEY --data-file="$RUNNER_TEMP/resend.txt" --project pit-log --force --non-interactive
          rm -f "$RUNNER_TEMP/resend.txt"
      - name: Deploy functions
        if: steps.gate.outputs.ok == 'true'
        run: npx -y firebase-tools@latest deploy --only functions,firestore:rules --project pit-log --force --non-interactive
